# ═══════════════════════════════════════════════════════════════════════════
#  Run scoring dictée — MÉTHODE C (end-to-end) AVEC LES FAUTES DÉJÀ OBSERVÉES
# ═══════════════════════════════════════════════════════════════════════════
#  Chaque item de la liste est accompagné des formes fautives réellement relevées
#  par les correcteurs sur CET item (champs `ex_*` de la grille) : 55 items sur 83
#  en portent au moins une, soit 44 fautes lexicales, 57 grammaticales et les
#  formes mixtes.
#
#  Hypothèse testée. L'analyse des 500 copies a montré que 90 % des fautes manquées
#  sont des items que le modèle transcrit À L'IDENTIQUE du mot attendu : il ne voit
#  pas la différence. Le goulot est donc perceptif, pas logique — ce qui explique
#  que ni la chain-of-thought ni le comptage n'aient rien donné. Montrer au modèle
#  les confusions attestées sur ce mot précis vise directement la lecture.
#
#  Risque propre à cette option, à surveiller dans les résultats : la SUGGESTION.
#  Un modèle à qui l'on montre « soire » peut lire « soire » là où l'élève a écrit
#  « soir ». Le symptôme serait une hausse du taux de faute attribué aux élèves
#  (bascules 1 → 9), là où tous les bras précédents le sous-estimaient de 3 à 9
#  points. Le prompt met explicitement en garde contre ce biais, mais c'est aux
#  chiffres de trancher, pas à la consigne.
#
#  Les autres options de raisonnement sont COUPÉES : l'écart doit être imputable
#  aux seuls exemples.
#
#  Lancer : uv run scripts/run_benchmark.py --config configs/scoring/dictee_end2end_exemples.yaml \
#             --limit 100 --model-name <modele>
#  Sortie : data/processed/dictee_end2end_exemples_<modele>_predictions.jsonl
# ═══════════════════════════════════════════════════════════════════════════

name: dictee_end2end_exemples
seed: 42
concurrency: 12

approach: end_to_end

model:
  name: qwen3-6-35b-moe
  kind: vlm
  temperature: 0.0
  # Le prompt d'ENTRÉE grossit de 44 % (7 761 → 11 205 caractères) ; la sortie, elle,
  # ne change pas. 16384 reste donc large, et aligne ce bras sur les autres.
  max_tokens: 16384
  request_logprobs: true
  max_retries: 2
  disable_thinking: true
  structured_output: true

data:
  corpus: dictee
  images_path: s3://projet-production-ecrits-depp/dictee_2015/
  labels_path: s3://projet-production-ecrits-depp/resultat_dictee_2015.csv
  grid_path: configs/grille_dictee_2015.json
  limit: null

grid:
  scheme: simplifiee

prompt:
  method: C
  n_few_shot: 0
  enforce_faithful: true
  read_final_state: true
  chain_of_thought: false
  count_items: false
  enforce_count: false
  check_neighbours: false
  # ← LE paramètre de ce bras.
  show_error_examples: true
