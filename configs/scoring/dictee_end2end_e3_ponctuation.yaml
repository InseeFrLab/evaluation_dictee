# ═══════════════════════════════════════════════════════════════════════════
#  Run scoring dictée — EXPÉRIMENTATION 3 : consigne dédiée à la ponctuation
# ═══════════════════════════════════════════════════════════════════════════
#  Base : comptage+ + exemples (D10). S'y ajoute :
#
#    check_punctuation_presence : pour un item ponctuation, vérifier D'ABORD
#    qu'un signe est réellement écrit avant de juger sa nature (0 = absent,
#    9 = présent mais du mauvais type). La méthode de codage générale (règle 4,
#    "compare lettre à lettre") est pensée pour des mots, pas pour vérifier
#    l'existence d'un signe.
#
#  Hypothèse testée (analyse du 18/09/2026, point F) : la ponctuation se rate
#  pour une raison DIFFÉRENTE des mots sur la plupart des modèles — omission
#  plutôt que faute (rapport_bras.py, section 7 : 0,18 à 0,23 de kappa en
#  moins sur la ponctuation que sur les mots, sauf qwen3-8-27b). Aucune règle
#  n'était jusqu'ici propre à ce cas.
#
#  Lancer (smoke-test recommandé avant 500 copies) :
#    uv run scripts/run_benchmark.py \
#      --config configs/scoring/dictee_end2end_e3_ponctuation.yaml \
#      --limit 10 --model-name <modele>
#  Sortie : data/processed/dictee_end2end_e3_ponctuation_<modele>_predictions.jsonl
# ═══════════════════════════════════════════════════════════════════════════

name: dictee_end2end_e3_ponctuation
seed: 42
concurrency: 12

approach: end_to_end

model:
  name: qwen3-6-35b-moe
  kind: vlm
  temperature: 0.0
  max_tokens: 16384
  request_logprobs: true
  max_retries: 2
  disable_thinking: true
  structured_output: true

data:
  corpus: dictee
  images_path: s3://projet-production-ecrits-depp/dictee_2015/
  labels_path: s3://projet-production-ecrits-depp/resultat_dictee_2015.csv
  grid_path: configs/grille_dictee_2015.json
  limit: null

grid:
  scheme: simplifiee

prompt:
  method: C
  n_few_shot: 0
  enforce_faithful: true
  read_final_state: true
  chain_of_thought: false
  # ← innovations conservées (comptage+ et exemples)
  count_items: true
  enforce_count: true
  check_neighbours: true
  show_error_examples: true
  # ← LE paramètre de cette expérimentation
  check_punctuation_presence: true
