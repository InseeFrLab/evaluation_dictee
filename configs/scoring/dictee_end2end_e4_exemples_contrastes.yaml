# ═══════════════════════════════════════════════════════════════════════════
#  Run scoring dictée — EXPÉRIMENTATION 4 : fautes connues, présentées en contraste
# ═══════════════════════════════════════════════════════════════════════════
#  Base : comptage+ + exemples (D10). S'y ajoute :
#
#    contrastive_examples : la liste de fautes déjà observées rappelle le mot
#    ATTENDU juste à côté, au lieu de lister les fautes seules.
#      avant : [fautes déjà observées : « inquiet », « inquiés »]
#      après : [attendu : « inquiets » — confusions fréquentes : « inquiet », « inquiés »]
#
#  Hypothèse testée (analyse du 18/09/2026, point G) : la liste de fautes seule
#  ne met en contraste que la forme fautive, jamais la forme correcte — malgré
#  les deux garde-fous déjà présents dans la consigne (liste non exhaustive,
#  jamais par suggestion), le risque de suggestion pourrait être réduit
#  davantage en rendant le bon mot visuellement aussi présent que les fautes.
#
#  Sans effet sur les autres bras : `contrastive_examples` ne change rien si
#  `show_error_examples` est faux (voir test dédié).
#
#  Lancer (smoke-test recommandé avant 500 copies) :
#    uv run scripts/run_benchmark.py \
#      --config configs/scoring/dictee_end2end_e4_exemples_contrastes.yaml \
#      --limit 10 --model-name <modele>
#  Sortie : data/processed/dictee_end2end_e4_exemples_contrastes_<modele>_predictions.jsonl
# ═══════════════════════════════════════════════════════════════════════════

name: dictee_end2end_e4_exemples_contrastes
seed: 42
concurrency: 12

approach: end_to_end

model:
  name: qwen3-6-35b-moe
  kind: vlm
  temperature: 0.0
  max_tokens: 16384
  request_logprobs: true
  max_retries: 2
  disable_thinking: true
  structured_output: true

data:
  corpus: dictee
  images_path: s3://projet-production-ecrits-depp/dictee_2015/
  labels_path: s3://projet-production-ecrits-depp/resultat_dictee_2015.csv
  grid_path: configs/grille_dictee_2015.json
  limit: null

grid:
  scheme: simplifiee

prompt:
  method: C
  n_few_shot: 0
  enforce_faithful: true
  read_final_state: true
  chain_of_thought: false
  # ← innovations conservées (comptage+ et exemples)
  count_items: true
  enforce_count: true
  check_neighbours: true
  show_error_examples: true
  # ← LE paramètre de cette expérimentation
  contrastive_examples: true
