# ═══════════════════════════════════════════════════════════════════════════
#  Run scoring dictée — MÉTHODE C (end-to-end) AVEC CHAIN-OF-THOUGHT PAR ITEM
# ═══════════════════════════════════════════════════════════════════════════
#  Bras « comparaison » à comparer à dictee_end2end.yaml : seul `chain_of_thought`
#  (et le budget de tokens qu'il impose) change. Le modèle écrit, pour CHAQUE item,
#  un champ « comparaison » décrivant la différence lue↔attendue AVANT de choisir
#  le code. Contrairement au raisonnement natif, le raisonnement est ici attribuable
#  item par item — mais il modifie le schéma de sortie.
#
#  ⚠ Le raisonnement natif est COUPÉ (`disable_thinking: true`) : activer les deux
#  rendrait tout écart inattribuable. Voir D7 dans docs/decisions.md.
#
#  ⚠ L'ordre des clés n'est PAS garanti par le décodage contraint (mesuré le
#  11/09/2026 : il varie d'un modèle et d'une requête à l'autre). Le pipeline le
#  vérifie désormais a posteriori : il journalise « Chain-of-thought DÉCORATIVE »
#  si le modèle écrit « comparaison » après « code », et le note item par item dans
#  la colonne `comparaison_avant_code` du JSONL. À surveiller dès le smoke-test :
#  si la CoT est décorative, aucun gain n'est attendu et il faut soit changer de
#  modèle, soit passer `structured_output: false`.
#
#  Lancer (smoke-test) :
#    uv run scripts/run_benchmark.py --config configs/scoring/dictee_end2end_cot.yaml --limit 20
#  Sortie : data/processed/dictee_end2end_cot_<modele>_predictions.jsonl
# ═══════════════════════════════════════════════════════════════════════════

name: dictee_end2end_cot
seed: 42
concurrency: 12

approach: end_to_end

model:
  name: qwen3-6-35b-moe
  kind: vlm
  temperature: 0.0
  # 16384 : le champ « comparaison » par item coûte +28 à +46 % de tokens (mesuré
  # sur les 83 items). 8192 passerait tout juste sur le codage texte, mais laisse
  # trop peu de marge en end-to-end, où le modèle décrit aussi l'image. Une réponse
  # tronquée code TOUTE la copie en « ? ».
  max_tokens: 16384
  request_logprobs: true
  max_retries: 2
  # Raisonnement natif COUPÉ : c'est l'autre bras, pas celui-ci.
  disable_thinking: true
  structured_output: true

data:
  corpus: dictee
  images_path: s3://projet-production-ecrits-depp/dictee_2015/
  labels_path: s3://projet-production-ecrits-depp/resultat_dictee_2015.csv
  grid_path: configs/grille_dictee_2015.json
  limit: null

grid:
  scheme: simplifiee

prompt:
  method: C
  n_few_shot: 0
  enforce_faithful: true
  read_final_state: true
  # ← LE paramètre de ce bras.
  chain_of_thought: true
