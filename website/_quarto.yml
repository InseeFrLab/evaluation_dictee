project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    # Écarts IA – humain : la page détaille copie par copie la transcription
    # produite par le modèle et le codage expert. Ce sont des productions
    # écrites de mineurs, et ce site est public — la page n'est donc pas
    # publiée. Elle reste rendable dans l'environnement sécurisé du SSP Cloud
    # en retirant cette ligne. Voir aussi la note « Données sensibles » de
    # `index.qmd` et le §6 de `CLAUDE.md`.
    - "!ecarts.qmd"
    - "cards/*.qmd"
    - "slides/*.qmd"
  resources:
    - "slides/_extensions/"
    - "slides/css/"
    - "slides/js/"
    - "slides/img/"
    - "slides/modulesCompl/"

website:
  title: "Évaluation automatique de la dictée"
  description: "Coder automatiquement la dictée manuscrite d'élèves avec des modèles d'IA, et en mesurer la fiabilité. DEPP × SSP Lab (INSEE)."
  page-footer:
    left: "DEPP × SSP Lab (INSEE)"
    right: "Construit avec [Quarto](https://quarto.org)"
  navbar:
    background: primary
    search: true
    left:
      - text: "Accueil"
        file: index.qmd
      - text: "Configuration du SSPCloud"
        file: initialisation.qmd
      - text: "Architecture"
        file: architecture.qmd
      - text: "Évaluation & métriques"
        file: evaluation.qmd
      - text: "Résultats"
        file: resultats.qmd
      - text: "Fine-tuning"
        file: finetuning.qmd
      - text: "Présentations"
        file: presentations.qmd

format:
  html:
    theme:
      - cosmo
      - style/styles.scss
    toc: true
    toc-title: "Sur cette page"
    toc-depth: 3
    number-sections: false
    code-copy: true
    code-overflow: wrap
    fig-responsive: true
    smooth-scroll: true

execute:
  freeze: auto
  echo: true
